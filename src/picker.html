<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    color: var(--color-text-primary, CanvasText);
    font: var(--font-text-md-size, .875rem)/1.45 var(--font-sans, system-ui, sans-serif);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  .picker {
    box-sizing: border-box;
    max-inline-size: 28rem;
    margin: 0;
    padding: 8px;
    border: 1px solid var(--color-border-primary, transparent);
    border-radius: var(--border-radius-lg, 8px);
    background: var(--color-background-primary, Canvas);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 6px 8px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-inline-size: 0;
  }
  #title {
    margin: 0;
    font-size: .875rem;
    font-weight: 600;
  }
  #count {
    color: var(--color-text-secondary, GrayText);
    font-size: .75rem;
  }
  #refresh-btn {
    border: 1px solid var(--color-border-primary, ButtonBorder);
    border-radius: 6px;
    padding: 2px 8px;
    background: var(--color-background-secondary, ButtonFace);
    color: var(--color-text-primary, ButtonText);
    font: inherit;
    font-size: .75rem;
    cursor: pointer;
  }
  #refresh-btn:hover {
    opacity: .85;
  }
  #servers {
    display: grid;
    gap: 2px;
    max-block-size: 16rem;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .server {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-inline-size: 0;
    min-block-size: 32px;
    padding: 4px 8px;
    border-radius: var(--border-radius-md, 6px);
    cursor: pointer;
  }
  .server:hover,
  .server:has(:focus-visible),
  .server:has(input:checked) {
    background: var(--color-background-secondary, ButtonFace);
  }
  .server input { position: absolute; inset-inline-start: 8px; opacity: 0; }
  .mark { display: inline-grid; flex: 0 0 14px; block-size: 16px; place-items: center; }
  .server input:checked + .mark::before { content: "✓"; font-weight: 600; }
  .server input:focus-visible + .mark { outline: 2px solid var(--color-ring-primary, Highlight); }
  .server-info {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-inline-size: 0;
    flex: 1;
  }
  .server-name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .server-sub {
    color: var(--color-text-secondary, GrayText);
    font-size: .75rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .server:has(input:disabled) { opacity: .6; cursor: default; }
  #loading, #status {
    margin: 0;
    padding: 5px 7px;
    color: var(--color-text-secondary, GrayText);
    font-size: var(--font-text-sm-size, .8rem);
  }
  #empty {
    display: grid;
    gap: 3px;
    padding: 8px;
  }
  #empty p { margin: 0; }
  #empty-title { font-weight: 500; }
  #empty-hint {
    color: var(--color-text-secondary, GrayText);
    font-size: var(--font-text-sm-size, .8rem);
    text-wrap: pretty;
  }
  #status { color: var(--color-text-danger, CanvasText); }
</style>
</head>
<body>
<main class="picker" id="picker">
  <header class="header">
    <div class="header-left">
      <h1 id="title"></h1>
      <span id="count"></span>
    </div>
    <button id="refresh-btn" type="button"></button>
  </header>
  <p id="loading" role="status"></p>
  <div id="servers"></div>
  <div id="empty" hidden>
    <p id="empty-title"></p>
    <p id="empty-hint"></p>
  </div>
  <p id="status" role="alert" hidden></p>
</main>
<script>/* picker */</script>
</body>
</html>
