<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --bg-subtle: var(--color-background-secondary, #f7f8fa);
    --bg-hover: var(--color-background-tertiary, #f0f2f5);
    --text: var(--color-text-primary, #1f2328);
    --text-muted: var(--color-text-secondary, #656d76);
    --border: var(--color-border-primary, rgba(31, 35, 40, 0.09));
    --border-strong: var(--color-border-secondary, rgba(31, 35, 40, 0.16));
    --accent: var(--color-ring-primary, #1a73e8);
    --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
    --btn-dark: var(--color-text-primary, #1f2328);
    --btn-dark-fg: var(--color-background-primary, #ffffff);
    --danger: var(--color-text-danger, #d93025);
    --success: var(--color-text-success, #188038);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 12px;
    font: 13.5px/1.5 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: var(--color-background-primary, #131316);
    --bg-subtle: var(--color-background-secondary, #1b1b1f);
    --bg-hover: var(--color-background-tertiary, #242429);
    --text: var(--color-text-primary, #eceef2);
    --text-muted: var(--color-text-secondary, #989ea8);
    --border: var(--color-border-primary, rgba(255, 255, 255, 0.09));
    --border-strong: var(--color-border-secondary, rgba(255, 255, 255, 0.16));
    --accent: var(--color-ring-primary, #8ab4f8);
    --btn-dark: #eceef2;
    --btn-dark-fg: #131316;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }

  .page {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 28px 44px;
  }

  body.compact .page {
    max-width: 100%;
    padding: 10px 12px 12px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  body.compact .topbar {
    align-items: center;
    margin-bottom: 10px;
  }

  .heading {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  body.compact h1 {
    font-size: 14px;
    font-weight: 600;
  }

  .subtitle {
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  body.compact .subtitle {
    display: none;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 9px;
    border-radius: 999px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .pill.active {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 28%, transparent);
    color: var(--accent);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
  }

  .btn:hover:not(:disabled) { background: var(--bg-subtle); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-primary {
    background: var(--btn-dark);
    color: var(--btn-dark-fg);
    border-color: transparent;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--btn-dark);
    opacity: 0.88;
  }

  .btn-icon {
    border-color: transparent;
    background: transparent;
    color: var(--text-muted);
    height: 28px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 450;
  }
  .btn-icon:hover:not(:disabled) {
    background: var(--bg-hover);
    color: var(--text);
  }
  .btn-icon.danger:hover:not(:disabled) {
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 8%, transparent);
  }

  body.compact .btn-add {
    height: 26px;
    padding: 0 9px;
    font-size: 12px;
  }

  .banner {
    margin-bottom: 14px;
    padding: 9px 12px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text);
  }
  .banner.error {
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 6%, var(--bg));
    border-color: color-mix(in srgb, var(--danger) 24%, transparent);
  }
  .banner.success {
    color: var(--success);
    background: color-mix(in srgb, var(--success) 6%, var(--bg));
    border-color: color-mix(in srgb, var(--success) 24%, transparent);
  }

  /* Antigravity-style unified hairline surface */
  .surface {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--bg);
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 16px;
    transition: background 120ms ease;
  }

  .row + .row {
    border-top: 1px solid var(--border);
  }

  .row:hover {
    background: var(--bg-subtle);
  }

  body.compact .row {
    padding: 9px 12px;
    gap: 10px;
  }

  .row-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }

  .row.selected .avatar {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 26%, transparent);
    color: var(--accent);
  }

  body.compact .avatar {
    width: 26px;
    height: 26px;
    border-radius: 6px;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }

  .name-line {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .name {
    font-weight: 500;
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tag {
    font-size: 11px;
    line-height: 1.4;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .meta-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
    min-width: 0;
    flex-wrap: wrap;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
  }
  .status-dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: currentColor;
  }
  .status-dot.ok { color: var(--success); }
  .status-dot.err { color: var(--danger); }

  .row-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .divider-v {
    width: 1px;
    height: 16px;
    background: var(--border);
    margin: 0 4px;
  }

  /* Antigravity-style pill toggle switch */
  .switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 34px;
    height: 20px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .switch input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
  }

  .track {
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--border-strong);
    transition: background 150ms ease;
    position: relative;
  }

  .thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    transition: transform 150ms ease;
  }

  .switch input:checked + .track {
    background: var(--accent);
  }

  .switch input:checked + .track .thumb {
    transform: translateX(14px);
  }

  .switch input:focus-visible + .track {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .switch input:disabled + .track {
    opacity: 0.5;
  }

  /* Empty state */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 52px 24px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--bg-subtle);
  }

  body.compact .empty {
    padding: 20px 14px;
  }

  .empty-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    color: var(--text-muted);
  }

  .empty h2 {
    margin: 2px 0 0;
    font-size: 14.5px;
    font-weight: 500;
  }

  .empty p {
    margin: 0 0 4px;
    max-width: 380px;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  /* Modal */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.26);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 20;
  }

  .dialog {
    width: 100%;
    max-width: 440px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    padding: 20px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14);
  }

  .dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .dialog-header h2 {
    margin: 0;
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 88px;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .field input {
    height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .field-hint {
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    padding: 3px;
    border-radius: 8px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }

  .seg button {
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }

  .seg button.active {
    background: var(--bg);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
  }

  .dialog-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .toggle-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    cursor: pointer;
  }

  .toggle-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .toggle-title {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
  }

  .tag-direct {
    color: var(--success);
    background: color-mix(in srgb, var(--success) 8%, var(--bg));
    border-color: color-mix(in srgb, var(--success) 28%, transparent);
  }

  .update-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    padding: 9px 12px;
    border-radius: var(--radius-md);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    background: var(--accent-soft);
    font-size: 12.5px;
  }

  .update-banner-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  body.compact .footer-bar {
    margin-top: 10px;
    padding-top: 8px;
  }

  .version-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .update-btn {
    height: 24px;
    padding: 0 8px;
    font-size: 11.5px;
  }

  .update-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--accent);
    display: inline-block;
  }

  @media (max-width: 540px) {
    .page { padding: 14px 12px; }
    .row { flex-wrap: wrap; gap: 10px; }
    .row-right { width: 100%; justify-content: flex-end; }
    .row-2 { grid-template-columns: 1fr 78px; }
  }
</style>
</head>
<body>
<main class="page" id="app-root">
  <header class="topbar">
    <div class="heading">
      <div class="title-row">
        <h1 id="page-title"></h1>
        <span class="pill" id="count-pill"></span>
      </div>
      <p class="subtitle" id="page-subtitle"></p>
    </div>
    <button class="btn btn-primary btn-add" id="add-btn" type="button"></button>
  </header>

  <div class="update-banner" id="update-banner" role="status" hidden>
    <span id="update-banner-text"></span>
    <div class="update-banner-actions">
      <button class="btn btn-primary" id="update-open-btn" type="button" style="height:26px;padding:0 10px;font-size:12px;"></button>
      <button class="btn btn-icon" id="update-dismiss-btn" type="button" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <div class="banner" id="banner" role="status" hidden></div>

  <section class="surface" id="server-list" hidden></section>

  <section class="empty" id="empty-state" hidden>
    <div class="empty-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="8" rx="2"/>
        <rect x="2" y="13" width="20" height="8" rx="2"/>
        <line x1="6" y1="7" x2="6.01" y2="7"/>
        <line x1="6" y1="17" x2="6.01" y2="17"/>
      </svg>
    </div>
    <h2 id="empty-title"></h2>
    <p id="empty-hint"></p>
    <button class="btn btn-primary" id="empty-add-btn" type="button"></button>
  </section>

  <footer class="footer-bar">
    <span class="version-text" id="version-label"></span>
    <button class="btn btn-icon update-btn" id="check-update-btn" type="button">
      <span class="update-dot" id="update-dot" hidden></span>
      <span id="check-update-label"></span>
    </button>
  </footer>
</main>

<div class="backdrop" id="modal-backdrop" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog-header">
      <h2 id="modal-title"></h2>
      <button class="btn btn-icon" id="modal-close" type="button" aria-label="Close">✕</button>
    </div>
    <form class="form" id="profile-form">
      <div class="field">
        <label for="f-name" id="lbl-name"></label>
        <input id="f-name" type="text" autocomplete="off">
      </div>
      <div class="row-2">
        <div class="field">
          <label for="f-host" id="lbl-host"></label>
          <input id="f-host" type="text" required autocomplete="off" placeholder="10.0.0.10">
        </div>
        <div class="field">
          <label for="f-port" id="lbl-port"></label>
          <input id="f-port" type="number" min="1" max="65535" value="22" required>
        </div>
      </div>
      <div class="field">
        <label for="f-user" id="lbl-user"></label>
        <input id="f-user" type="text" required autocomplete="off" placeholder="root">
      </div>
      <div class="field">
        <label id="lbl-auth"></label>
        <div class="seg">
          <button type="button" id="seg-password"></button>
          <button type="button" id="seg-key"></button>
        </div>
      </div>
      <div class="field" id="group-password">
        <label for="f-password" id="lbl-password"></label>
        <input id="f-password" type="password" autocomplete="new-password">
        <span class="field-hint" id="hint-password" hidden></span>
      </div>
      <div class="field" id="group-key" hidden>
        <label for="f-keypath" id="lbl-keypath"></label>
        <input id="f-keypath" type="text" autocomplete="off" placeholder="~/.ssh/id_ed25519">
      </div>
      <div class="field" id="group-passphrase" hidden>
        <label for="f-passphrase" id="lbl-passphrase"></label>
        <input id="f-passphrase" type="password" autocomplete="new-password">
        <span class="field-hint" id="hint-passphrase" hidden></span>
      </div>
      <label class="toggle-row" for="f-bypass-proxy">
        <span class="toggle-text">
          <span class="toggle-title" id="lbl-bypass-proxy"></span>
          <span class="field-hint" id="hint-bypass-proxy"></span>
        </span>
        <span class="switch">
          <input id="f-bypass-proxy" type="checkbox">
          <span class="track"><span class="thumb"></span></span>
        </span>
      </label>
      <div class="banner error" id="form-error" hidden></div>
      <div class="dialog-footer">
        <button class="btn" id="cancel-btn" type="button"></button>
        <button class="btn btn-primary" id="save-btn" type="submit"></button>
      </div>
    </form>
  </div>
</div>

<script>/* picker */</script>
</body>
</html>
